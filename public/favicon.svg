<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Background -->
  <circle cx="32" cy="32" r="32" fill="#16a34a"/>
  <!-- Rear wheel -->
  <circle cx="18" cy="41" r="11" fill="none" stroke="white" stroke-width="3"/>
  <!-- Front wheel -->
  <circle cx="46" cy="41" r="11" fill="none" stroke="white" stroke-width="3"/>
  <!-- Frame: seat tube -->
  <line x1="28" y1="24" x2="18" y2="41" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <!-- Frame: top tube -->
  <line x1="28" y1="24" x2="39" y2="24" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <!-- Frame: chain stay + seat stay -->
  <line x1="39" y1="24" x2="18" y2="41" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="39" y1="24" x2="46" y2="41" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <!-- Seat -->
  <line x1="25" y1="23" x2="31" y2="23" stroke="white" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Handlebar stem -->
  <line x1="39" y1="24" x2="41" y2="17" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <!-- Handlebar -->
  <line x1="38" y1="17" x2="44" y2="17" stroke="white" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Bottom bracket / pedals -->
  <circle cx="30" cy="38" r="3.5" fill="white"/>
</svg>
